name: "PostHog CI Metrics"
description: "Track workflow duration, success rates, and CI performance in PostHog"
author: "PostHog"
branding:
  icon: "activity"
  color: "orange"
inputs:
  posthog-token:
    description: 'Your PostHog API token - see project settings section "Project API Key"'
    required: true
  posthog-api-host:
    description: "Your PostHog API host"
    required: false
    default: "https://us.i.posthog.com"
  event:
    description: 'The event name to capture e.g. "GitHubActionCompleted". Optional when only creating an annotation.'
    required: false
  properties:
    description: "Properties to add to the event - as a JSON string. Must be possible to `JSON.parse(properties)`"
    required: false
  capture-run-duration:
    description: "Capture run duration via GitHub API (adds duration_seconds and run metadata)"
    required: false
    default: "false"
  capture-job-durations:
    description: "Capture timing and status for each job in the workflow (emits one event per job)"
    required: false
    default: "false"
  github-token:
    description: "GitHub token for API access (required for capture-run-duration, capture-job-durations, and status-job)"
    required: false
  runner:
    description: "Optional runner label to include in properties (e.g., 'depot')"
    required: false
  status-job:
    description: "Job name to check for workflow status (e.g., 'Django Tests Pass'). Captures that job's conclusion."
    required: false
  annotation:
    description: "Create a PostHog annotation with this text (e.g., 'Deployed to production'). Can be used standalone or alongside event capture."
    required: false
  annotation-token:
    description: "API key for the annotations REST API — a personal API key with the annotation:write scope. Defaults to posthog-token. Set this explicitly when capturing an event AND creating an annotation in the same step, because event ingestion uses the project API key while annotations need a personal key."
    required: false
  annotation-scope:
    description: "Annotation scope: 'project' (default) or 'organization'"
    required: false
    default: "project"
  annotation-hidden:
    description: "If 'true', hide the annotation from the PostHog UI (charts and the annotations list) while keeping it readable via the API and MCP. Use for high-frequency markers like deployments. Defaults to 'false'."
    required: false
    default: "false"
  annotation-api-host:
    description: "Host for the PostHog app API used to create annotations — the app host (e.g. https://us.posthog.com, https://eu.posthog.com, or a self-hosted host), NOT the event ingestion host in posthog-api-host. Not restricted to PostHog Cloud."
    required: false
    default: "https://us.posthog.com"
  annotation-project-id:
    description: "Project to create the annotation in. Defaults to '@current' (the project the token belongs to)."
    required: false
    default: "@current"
  annotation-dedupe:
    description: "If 'true', skip creating the annotation when a matching one already exists (idempotent re-runs). Match is by annotation-dedupe-key, or the full annotation text if no key is set. Defaults to 'false'."
    required: false
    default: "false"
  annotation-dedupe-key:
    description: "Content prefix used to detect an existing annotation when annotation-dedupe is true. Defaults to the full annotation text. Use a stable prefix (e.g. 'Deployed repo@sha to env') so a volatile suffix like a PR list doesn't defeat dedupe."
    required: false
runs:
  using: "node24"
  main: "dist/index.js"
